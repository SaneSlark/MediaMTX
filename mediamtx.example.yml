###############################################
# Global settings -> General

logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1452
udpReadBufferSize: 0

###############################################
# Global settings -> Authentication

authMethod: internal
authInternalUsers:
  # Admin user
  - user: admin
    pass: CHANGE_ME
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

  # Default user
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: publish
      - action: playback

###############################################
# Global settings -> Control API

api: true
apiAddress: :9997
apiEncryption: false
apiAllowOrigins: ['*']
apiTrustedProxies: []

metrics: true
metricsAddress: :9998
metricsEncryption: false
metricsAllowOrigins: ['*']
metricsTrustedProxies: []

pprof: true
pprofAddress: :9999
pprofEncryption: false
pprofAllowOrigins: ['*']
pprofTrustedProxies: []

###############################################
# Global settings -> Playback server

playback: true
playbackAddress: :9996
playbackEncryption: false
playbackAllowOrigins: ['*']
playbackTrustedProxies: []

###############################################
# Global settings -> RTMP server

rtmp: false
rtmpAddress: :1935

###############################################
# Global settings -> RTSP server

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp, udp]

###############################################
# Global settings -> HLS server

hls: false
hlsAddress: :8888
hlsEncryption: false
hlsAllowOrigins: ['*']
hlsTrustedProxies: []
hlsAlwaysRemux: false
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 10

###############################################
# Global settings -> WebRTC server

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ['*']
webrtcTrustedProxies: []

webrtcLocalUDPAddress: :8189
# 公网或局域网访问时填写服务器可达的域名/IP。
webrtcAdditionalHosts: []
# webrtcICEServers2: [stun:stun.l.google.com:19302]

###############################################
# Global settings -> SRT server

srt: false
srtAddress: :8890

###############################################
# MoQ server

moq: false
moqQUICAddress: :8893
moqHTTP2Address: :8892
moqHTTP3Address: :8892
moqAllowOrigins: ["*"]
moqTrustedProxies: []

###############################################
# Default path settings

pathDefaults:
  useAbsoluteTimestamp: false
  sourceOnDemand: false
  rtspTransport: tcp

###############################################
# Path settings

paths:
  camera1:
    source: rtsp://USER:PASSWORD@CAMERA_HOST:554/unicast/c1/s0/live
    record: yes
    recordPath: /data/recordings/%path/%Y%m%d_%H%M%S_%f
    recordFormat: fmp4
    recordPartDuration: 10s
    recordSegmentDuration: 1h
    recordDeleteAfter: 30d

  camera1-5s:
    source: publisher
