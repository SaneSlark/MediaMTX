services:
  mediamtx:
    image: ghcr.io/saneslark/mediamtx:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediamtx
    restart: unless-stopped
    network_mode: host
    shm_size: "1g"
    environment:
      MEDIAMTX_CONFIG: /config/mediamtx.yml
      MEDIAMTX_BASE: http://localhost:9996
      DELAY_NS: 5000000000
      CACHE_KEEP_FOREVER: "false"
      CACHE_TTL_DAYS: 90
      CLEAN_INTERVAL_DAYS: 1
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./mediamtx.yml:/config/mediamtx.yml:ro
      - ./recordings:/data/recordings
      - ./media_cache:/app/proxy/media_cache
