services:
  replay:
    image: ghcr.io/saneslark/mediamtx-replay:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediamtx-replay
    restart: unless-stopped
    shm_size: "1g"
    ports:
      - "9995:9995"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      TZ: Asia/Shanghai
      PORT: 9995
      MEMORY_DIR: /dev/shm
      MAX_MEMORY_JOBS: 2
      MEDIAMTX_BASE: ${MEDIAMTX_BASE:-http://host.docker.internal:9996}
      CACHE_KEEP_FOREVER: "false"
      CACHE_TTL_DAYS: 90
      CLEAN_INT_DAYS: 1

    volumes:
      - ./media_cache:/app/proxy/media_cache

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
